name: Build and deploy site to AWS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build_deploy:
    name: Build site and deploy to AWS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.125.5'
      - name: Build
        run: hugo --gc --minify --panicOnWarning --cleanDestinationDir
      - name: Check generated site
        run: python3 scripts/check_site.py
      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::415161357326:role/GitHubActionsOmniDeploy
          aws-region: us-east-1
      - name: Upload to S3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          aws s3 sync ./public s3://jabdy.com --exclude '*.html' --no-progress
          aws s3 cp ./public s3://jabdy.com --recursive --exclude '*' --include '*.html' --content-type 'text/html; charset=utf-8' --cache-control 'public,max-age=0,must-revalidate' --no-progress
          aws s3 cp ./public/apps s3://jabdy.com/apps --recursive --exclude '*' --include '*/manifest.json' --content-type 'application/json' --cache-control 'public,max-age=300' --no-progress
          while IFS= read -r path; do
            aws s3 rm "s3://jabdy.com/$path"
          done < scripts/retired-assets.txt
